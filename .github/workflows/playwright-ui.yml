name: Daloy UI - Playwright responsive screenshots

on:
  workflow_dispatch:
  push:
    branches:
      - chore/render-migration-20261119
    paths:
      - 'resources/**'
      - 'tests/e2e/**'
      - 'playwright.config.mjs'
      - '.github/workflows/playwright-ui.yml'

concurrency:
  group: daloy-ui-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ui-screenshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: 'true'
      E2E_BASE_URL: https://daloy-render-preview.onrender.com
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install app dependencies
        run: npm ci
      - name: Build frontend (catch Vite and JSX regressions)
        run: npm run build
      - name: Install Playwright test runner (no lockfile mutation)
        run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Audit public pages on 5 viewport widths
        run: npx playwright test tests/e2e/responsive.spec.mjs
      - name: Upload screenshots, report and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daloy-playwright-visual-report
          if-no-files-found: warn
          retention-days: 14
          path: |
            playwright-report/
            test-results/
